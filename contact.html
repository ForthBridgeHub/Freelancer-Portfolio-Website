<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">MyPortfolio</h1>
        <ul class="flex gap-6">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="text-blue-600">Contact</a></li>
        </ul>
      </div>
    </nav>

    <!-- Contact Section -->
    <main class="flex-1 max-w-md mx-auto py-12 px-6">
      <h2 class="text-3xl font-bold mb-6 text-center">Contact Me</h2>
      <form id="contactForm" class="bg-white shadow-md rounded-lg p-6 space-y-4">
        <input type="text" placeholder="Your Name" class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500" required />
        <input type="email" placeholder="Your Email" class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500" required />
        <textarea placeholder="Your Message" rows="4" class="w-full border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500" required></textarea>
        <button type="submit" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition">Send Message</button>
      </form>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 text-center py-4 text-sm text-gray-500">
      © 2025 Jane Doe. All rights reserved.
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
